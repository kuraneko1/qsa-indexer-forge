[project]
name = "qsa-indexer-forge"
version = "0.1.0"
description = "Reproducible QSA indexer distillation and llama.cpp integration for Qwen3.8-27B"
requires-python = ">=3.11"
dependencies = ["torch>=2.6"]

[project.optional-dependencies]
train = [
  "transformers==5.22.1",
  "accelerate",
  "datasets",
  "pyyaml",
  "huggingface-hub",
  "httpx2",
  "pillow",
  "torchvision",
]
export = [
  "transformers==5.22.1",
  "huggingface-hub",
  "safetensors",
  "accelerate",
  "pillow",
  "torchvision",
]
dev = ["pytest", "pyyaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
